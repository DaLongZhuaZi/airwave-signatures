# 来源清单：每一项都注明抓取方式、许可证与在产物中的角色。
# 构建脚本只从这里列出的地址抓取；新增来源先补这一份清单再写转换器。

sources:
  - id: upstream-fieldwatch
    name: "OffGridPete/Fieldwatch (Android) stock catalog"
    url: "https://raw.githubusercontent.com/OffGridPete/Fieldwatch/main/dist/fieldwatch-signatures-v2.json"
    license: "MIT"
    role: "签名目录基底（全量透传，随后各阶段富化）"
    fetch: "pipeline/fetch_sources.py -> .cache/upstream-catalog.json"

  - id: theengs-decoder
    name: "Theengs Decoder device definitions"
    url: "https://github.com/theengs/decoder (src/devices/*.h)"
    license: "GPL-3.0 (device definition data; converted rules are factual identifiers)"
    role: "BLE 设备指纹富化（pipeline/converters/theengs.py）"
    fetch: "GitHub contents API listing + raw .h files -> .cache/theengs-devices/"

  - id: xiaomi-ble
    name: "Bluetooth-Devices/xiaomi-ble DEVICE_TYPES (Home Assistant ecosystem)"
    url: "https://github.com/Bluetooth-Devices/xiaomi-ble"
    license: "MIT"
    role: "小米 MiBeacon 产品 ID 表 -> fleet-mibeacon-*（pipeline/converters/xiaomi_mibeacon.py）"
    fetch: "raw devices.py -> .cache/xiaomi-ble-devices.py (ast 解析，不执行)"

  - id: ieee-oui
    name: "IEEE Registration Authority MA-L / MA-M / MA-S"
    url: "https://standards-oui.ieee.org/"
    license: "Public factual registry"
    role: "radiodb 的 mal/long 段 + 厂商 OUI fleet 生成/增补（pipeline/converters/ieee_vendors.py）"
    fetch: "oui.csv / mam.csv / oui36.csv（须带浏览器 UA，否则 HTTP 418）"

  - id: bluetooth-sig-assigned-numbers
    name: "Bluetooth SIG Assigned Numbers (company IDs, appearance, service UUIDs incl. member UUIDs)"
    url: "https://bitbucket.org/bluetooth-SIG/public"
    license: "Bluetooth SIG proprietary document; only factual number->name pairs are compiled into radiodb (no document text is redistributed)"
    role: "radiodb 的 btc/app/uuid 段"
    fetch: "service_uuids.yaml / member_uuids.yaml / company_identifiers.yaml / appearance_values.yaml"

  - id: nordic-bluetooth-numbers
    name: "Nordic Semiconductor bluetooth-numbers-database"
    url: "https://github.com/NordicSemiconductor/bluetooth-numbers-database"
    license: "BSD-3-Clause"
    role: "radiodb uuid 段补漏（SIG 两表之后并入，命名以 SIG 为准）"
    fetch: "v1/service_uuids.json"

  - id: manual-fleets
    name: "Hand-curated fleets in this repo (fleets/manual/*.json, fleets/vendors.json)"
    url: "this repository"
    license: "MIT"
    role: "协议级特征（MiBeacon/BTHome/Eddystone）与国内厂商 OUI 精选；每条必须在文件内注明出处"
    fetch: "local files"

  - id: wireshark-manuf
    name: "Wireshark manuf (reference only)"
    url: "https://gitlab.com/wireshark/wireshark/-/raw/master/manuf"
    license: "GPL-2.0"
    role: "仅作 OUI 交叉校验参考，不直接进任何产物；抓取失败不阻断构建"
    fetch: ".cache/manuf (optional)"

  - id: flipper-ble-spam
    name: "Flipper Zero ble_spam app (Next-Flip/Momentum-Apps) protocol tables"
    url: "https://github.com/Next-Flip/Momentum-Apps (ble_spam/protocols/fastpair.c, easysetup.c)"
    license: "GPL-3.0 (community reverse-assembled identifier tables; converted rules are factual identifiers)"
    role: "Fast Pair 型号 ID 表 -> fleet-fastpair-*；Samsung EasySetup 型号字节 -> fleet-easysetup-*（pipeline/converters/fastpair.py, samsung_easysetup.py）"
    fetch: "raw .c files -> .cache/fastpair.c, .cache/easysetup.c"

  - id: bruce-firmware
    name: "Bruce firmware (BruceDevices/firmware) APPLE_PROXIMITY_DEVICES"
    url: "https://github.com/BruceDevices/firmware (src/modules/ble/ble_spam.cpp)"
    license: "GPL-3.0 (community table ported from Flipper ble_spam; converted rules are factual identifiers)"
    role: "Apple Proximity Pairing 型号字 -> fleet-proximity-*（pipeline/converters/apple_proximity.py）"
    fetch: "raw ble_spam.cpp -> .cache/bruce-ble-spam.cpp"

  - id: bluemaestro-ble
    name: "Bluetooth-Devices/bluemaestro-ble parser (Home Assistant ecosystem)"
    url: "https://github.com/Bluetooth-Devices/bluemaestro-ble"
    license: "MIT"
    role: "BlueMaestro 设备类型字节 -> fleet-bluemaestro-*（pipeline/converters/bluemaestro.py）"
    fetch: "raw parser.py -> .cache/bluemaestro-parser.py (regex 解析，不执行)"

  - id: airguard
    name: "seemoo-lab/AirGuard tracker definitions (TU Darmstadt)"
    url: "https://github.com/seemoo-lab/AirGuard"
    license: "Apache-2.0"
    role: "追踪器识别数值出处（FD69/FE33/FA25 等手工 fleet 的 provenance；FMDN/Tile/SmartTag 经核对已由上游覆盖）"
    fetch: "手工核对（fleets/manual/*.json 的 notes 逐条注明）"

  - id: openscale
    name: "oliexdev/openScale supported-scale handlers"
    url: "https://github.com/oliexdev/openScale"
    license: "GPL-3.0 (broadcast name patterns are factual)"
    role: "体重秤广播名模式出处（云麦/Picooc/QN 手工 fleet）"
    fetch: "手工核对（fleets/manual/*.json 的 notes 逐条注明）"

  - id: ble-monitor
    name: "custom-components/ble_monitor ble_parser (Home Assistant community)"
    url: "https://github.com/Ernst79/ble_monitor"
    license: "MIT"
    role: "Theengs 未覆盖品牌的识别表 -> fleets/blemonitor.json（人工提取，转换器 pipeline/converters/blemonitor.py）"
    fetch: "手工提取（识别逻辑是命令式代码，不适合逐文件自动抓取转换；刷新纪律见 fleets/blemonitor.json 头注）"

  - id: switchbot-api-ble
    name: "OpenWonderLabs/SwitchBotAPI-BLE official advertisement spec"
    url: "https://github.com/OpenWonderLabs/SwitchBotAPI-BLE"
    license: "未声明（仅取事实性设备类型码）"
    role: "SwitchBot 官方类型码缺口出处（fleets/manual/switchbot-*.json）"
    fetch: "手工核对（notes 逐条注明）"

  - id: ieee-cid
    name: "IEEE Registration Authority CID registry"
    url: "https://standards-oui.ieee.org/cid/cid.csv"
    license: "Public factual registry"
    role: "radiodb 的 cid 段（EUI-48 Company ID，App 作 24 位厂商兜底查询）"
    fetch: "pipeline/fetch_sources.py -> .cache/cid.csv"
